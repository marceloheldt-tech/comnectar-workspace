<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:'Rubik',sans-serif;background:#000000;color:#FFFFFF;display:flex;flex-direction:column}
.serif{font-family:'Geotipe','Palatino Linotype',Georgia,serif;font-weight:400}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:96px 80px 0 80px}
.wordmark{width:340px;filter:brightness(0) invert(1);margin-bottom:32px}
.gota{width:260px;margin-bottom:44px}
.kicker{font-weight:600;font-size:46px;letter-spacing:10px;text-transform:uppercase;color:#991356;margin-bottom:40px}
.headline{line-height:1}
.ate{font-size:58px;color:#FFFFFF;margin-bottom:6px}
.pct{font-size:320px;color:#991356;line-height:0.95}
.off{font-size:84px;color:#FFFFFF;letter-spacing:5px;margin-top:8px;margin-bottom:64px}
.sub{font-size:44px;color:rgba(255,255,255,0.86);max-width:860px;line-height:1.4;margin-bottom:56px}
.badges{display:flex;flex-direction:column;align-items:center;gap:20px;margin-bottom:64px}
.badge-row{display:flex;align-items:center;gap:20px}
.badge{border:1px solid rgba(255,255,255,0.6);border-radius:12px;padding:20px 34px;font-size:34px;font-weight:500;color:#FFFFFF}
.plus{font-size:38px;color:#991356;font-weight:600}
.dates{font-size:38px;font-weight:500;color:#FFFFFF;letter-spacing:1px;margin-bottom:72px}
.cta{background:#991356;border-radius:12px;width:420px;height:112px}
</style></head><body>
<div class="wrap">
<img class="wordmark" src="../../../dados/comnectar-transparente.png">
<img class="gota" src="../../../dados/gota-transparente.png">
<div class="kicker">Black Week</div>
<div class="headline serif">
<div class="ate">Até</div>
<div class="pct">45%</div>
<div class="off">OFF</div>
</div>
<div class="sub serif">Somando desconto da campanha, desconto no Pix e cashback</div>
<div class="badges">
<div class="badge-row">
<div class="badge">Campanha</div>
<div class="plus">+</div>
<div class="badge">Pix</div>
</div>
<div class="badge-row">
<div class="plus">+</div>
<div class="badge">Cashback</div>
</div>
</div>
<div class="dates">24 A 30 DE NOVEMBRO</div>
<div class="cta"></div>
</div>
</body></html>
