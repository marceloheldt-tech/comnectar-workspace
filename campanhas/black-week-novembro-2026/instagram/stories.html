<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:'Rubik',sans-serif;background:#FFFFFF;color:#000000;display:flex;flex-direction:column}
.serif{font-family:'Geotipe','Palatino Linotype',Georgia,serif;font-weight:400}
.logo{position:absolute;top:96px;left:64px;width:150px}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px}
.kicker{font-weight:600;font-size:36px;letter-spacing:9px;text-transform:uppercase;color:#991356;margin-bottom:48px}
.headline{line-height:1}
.ate{font-size:58px;color:#000000;margin-bottom:6px}
.pct{font-size:320px;color:#991356;line-height:0.95}
.off{font-size:84px;color:#000000;letter-spacing:5px;margin-top:8px;margin-bottom:64px}
.sub{font-size:44px;color:#1a1a1a;max-width:860px;line-height:1.4;margin-bottom:56px}
.badges{display:flex;flex-direction:column;align-items:center;gap:20px;margin-bottom:64px}
.badge-row{display:flex;align-items:center;gap:20px}
.badge{border:1px solid #000000;border-radius:12px;padding:20px 34px;font-size:34px;font-weight:500}
.plus{font-size:38px;color:#991356;font-weight:600}
.dates{font-size:38px;font-weight:500;color:#000000;letter-spacing:1px;margin-bottom:72px}
.cta{background:#991356;color:#FFFFFF;border-radius:12px;padding:30px 64px;font-size:36px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.linkbio{margin-top:28px;font-size:30px;color:#1a1a1a;opacity:.7;letter-spacing:1px;text-transform:uppercase}
</style></head><body>
<img class="logo" src="../../../dados/gota-transparente.png">
<div class="wrap">
<div class="kicker">Black Week</div>
<div class="headline serif">
<div class="ate">Até</div>
<div class="pct">45%</div>
<div class="off">OFF</div>
</div>
<div class="sub serif">Somando desconto da campanha, desconto no Pix e cashback</div>
<div class="badges">
<div class="badge-row">
<div class="badge">Campanha</div>
<div class="plus">+</div>
<div class="badge">Pix</div>
</div>
<div class="badge-row">
<div class="plus">+</div>
<div class="badge">Cashback</div>
</div>
</div>
<div class="dates">24 A 30 DE NOVEMBRO</div>
<div class="cta">Vinhos participantes</div>
<div class="linkbio">Link na bio</div>
</div>
</body></html>
