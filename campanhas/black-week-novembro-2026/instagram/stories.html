<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:'Rubik',sans-serif;background:#000000;color:#FFFFFF;display:flex;flex-direction:column}
.serif{font-family:'Geotipe','Palatino Linotype',Georgia,serif;font-weight:400}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:240px 24px 0 24px}
.logo-crop{overflow:hidden;position:relative}
.logo-crop img{position:absolute;filter:brightness(0) invert(1)}
.wordmark-crop{width:1020px;height:241.9px;margin-bottom:14px}
.wordmark-crop img{width:1807.3px;height:1016.6px;left:-393.5px;top:-387.2px}
.gota-crop{width:134.6px;height:150px;margin-bottom:24px}
.gota-crop img{width:462.6px;height:260.1px;left:-160.3px;top:-51.9px}
.kicker{font-weight:600;font-size:40px;letter-spacing:9px;text-transform:uppercase;color:#991356;margin-bottom:24px}
.headline{line-height:1}
.ate{font-size:48px;color:#FFFFFF;margin-bottom:4px}
.pct{font-size:250px;color:#991356;line-height:0.95}
.off{font-size:64px;color:#FFFFFF;letter-spacing:4px;margin-top:4px;margin-bottom:36px}
.sub{font-size:36px;color:rgba(255,255,255,0.86);max-width:860px;line-height:1.35;margin-bottom:32px}
.badges{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:36px}
.badge-row{display:flex;align-items:center;gap:16px}
.badge{border:1px solid rgba(255,255,255,0.6);border-radius:12px;padding:14px 26px;font-size:28px;font-weight:500;color:#FFFFFF}
.plus{font-size:30px;color:#991356;font-weight:600}
.dates{font-size:30px;font-weight:500;color:#FFFFFF;letter-spacing:1px;margin-bottom:40px}
.cta{background:#991356;border-radius:12px;width:380px;height:96px}
</style></head><body>
<div class="wrap">
<div class="logo-crop wordmark-crop"><img src="../../../dados/comnectar-transparente.png"></div>
<div class="logo-crop gota-crop"><img src="../../../dados/gota-transparente.png"></div>
<div class="kicker">Black Week</div>
<div class="headline serif">
<div class="ate">Até</div>
<div class="pct">45%</div>
<div class="off">OFF</div>
</div>
<div class="sub serif">Somando desconto da campanha, desconto no Pix e cashback</div>
<div class="badges">
<div class="badge-row">
<div class="badge">Campanha</div>
<div class="plus">+</div>
<div class="badge">Pix</div>
</div>
<div class="badge-row">
<div class="plus">+</div>
<div class="badge">Cashback</div>
</div>
</div>
<div class="dates">24 A 30 DE NOVEMBRO</div>
<div class="cta"></div>
</div>
</body></html>
