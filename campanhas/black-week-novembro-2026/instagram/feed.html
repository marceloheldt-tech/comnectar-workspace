<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:'Rubik',sans-serif;background:#FFFFFF;color:#000000;display:flex;flex-direction:column}
.serif{font-family:'Geotipe','Palatino Linotype',Georgia,serif;font-weight:400}
.logo{position:absolute;top:64px;left:56px;width:140px}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 70px}
.kicker{font-weight:600;font-size:32px;letter-spacing:8px;text-transform:uppercase;color:#991356;margin-bottom:36px}
.headline{line-height:1}
.ate{font-size:52px;color:#000000;margin-bottom:4px}
.pct{font-size:260px;color:#991356;line-height:0.95}
.off{font-size:72px;color:#000000;letter-spacing:4px;margin-top:4px;margin-bottom:48px}
.sub{font-size:38px;color:#1a1a1a;max-width:820px;line-height:1.4;margin-bottom:44px}
.badges{display:flex;align-items:center;gap:20px;margin-bottom:48px}
.badge{border:1px solid #000000;border-radius:10px;padding:16px 28px;font-size:30px;font-weight:500}
.plus{font-size:34px;color:#991356;font-weight:600}
.dates{font-size:34px;font-weight:500;color:#000000;letter-spacing:1px;margin-bottom:56px}
.cta{background:#991356;color:#FFFFFF;border-radius:10px;padding:26px 56px;font-size:32px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.linkbio{margin-top:24px;font-size:26px;color:#1a1a1a;opacity:.7;letter-spacing:1px;text-transform:uppercase}
</style></head><body>
<img class="logo" src="../../../dados/gota-transparente.png">
<div class="wrap">
<div class="kicker">Black Week</div>
<div class="headline serif">
<div class="ate">Até</div>
<div class="pct">45%</div>
<div class="off">OFF</div>
</div>
<div class="sub serif">Somando desconto da campanha, desconto no Pix e cashback</div>
<div class="badges">
<div class="badge">Campanha</div>
<div class="plus">+</div>
<div class="badge">Pix</div>
<div class="plus">+</div>
<div class="badge">Cashback</div>
</div>
<div class="dates">24 A 30 DE NOVEMBRO</div>
<div class="cta">Vinhos participantes</div>
<div class="linkbio">Link na bio</div>
</div>
</body></html>
