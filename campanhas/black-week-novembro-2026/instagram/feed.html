<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:'Rubik',sans-serif;background:#000000;color:#FFFFFF;display:flex;flex-direction:column}
.serif{font-family:'Geotipe','Palatino Linotype',Georgia,serif;font-weight:400}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 50px 0 50px}
.wordmark{width:900px;filter:brightness(0) invert(1);margin-bottom:6px}
.gota{width:130px;margin-bottom:14px}
.kicker{font-weight:600;font-size:36px;letter-spacing:8px;text-transform:uppercase;color:#991356;margin-bottom:16px}
.headline{line-height:1}
.ate{font-size:40px;color:#FFFFFF;margin-bottom:2px}
.pct{font-size:190px;color:#991356;line-height:0.95}
.off{font-size:52px;color:#FFFFFF;letter-spacing:3px;margin-top:2px;margin-bottom:20px}
.sub{font-size:30px;color:rgba(255,255,255,0.86);max-width:820px;line-height:1.35;margin-bottom:20px}
.badges{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.badge{border:1px solid rgba(255,255,255,0.6);border-radius:10px;padding:12px 22px;font-size:26px;font-weight:500;color:#FFFFFF}
.plus{font-size:28px;color:#991356;font-weight:600}
.dates{font-size:28px;font-weight:500;color:#FFFFFF;letter-spacing:1px;margin-bottom:22px}
.cta{background:#991356;color:#FFFFFF;border-radius:10px;padding:20px 44px;font-size:28px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
</style></head><body>
<div class="wrap">
<img class="wordmark" src="../../../dados/comnectar-transparente.png">
<img class="gota" src="../../../dados/gota-transparente.png">
<div class="kicker">Black Week</div>
<div class="headline serif">
<div class="ate">Até</div>
<div class="pct">45%</div>
<div class="off">OFF</div>
</div>
<div class="sub serif">Somando desconto da campanha, desconto no Pix e cashback</div>
<div class="badges">
<div class="badge">Campanha</div>
<div class="plus">+</div>
<div class="badge">Pix</div>
<div class="plus">+</div>
<div class="badge">Cashback</div>
</div>
<div class="dates">24 A 30 DE NOVEMBRO</div>
<div class="cta">Link na bio</div>
</div>
</body></html>
