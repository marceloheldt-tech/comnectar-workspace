<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; position:relative; font-family:'Rubik',sans-serif; }

  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 55%; }
  .overlay {
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.55) 48%, rgba(0,0,0,0.92) 100%);
  }
  .noise { position:absolute; inset:0; opacity:0.05; mix-blend-mode:overlay; }

  .logo { position:absolute; bottom:64px; right:56px; width:120px; filter:drop-shadow(0 4px 20px rgba(0,0,0,0.5)); }

  .number-wrap { position:absolute; top:110px; left:56px; }
  .number {
    font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;
    font-size:275px; color:#FFFFFF; line-height:0.9; font-weight:400;
    text-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .number-label {
    color:#991356; background:rgba(255,255,255,0.95); display:inline-block;
    font-size:21px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;
    padding:8px 18px; margin-top:16px;
  }

  .body {
    position:absolute; left:56px; right:100px; bottom:110px;
    color:#FFFFFF; font-size:41px; font-weight:400; line-height:1.46;
  }
  .body b { color:#991356; font-weight:600; }

  .progress { position:absolute; bottom:0; left:0; height:3px; width:100%; background:rgba(255,255,255,0.18); }
  .progress-fill { height:100%; width:37.5%; background:#991356; }
</style>
</head>
<body>
  <img class="bg" src="../imagens/slide-3-adega.jpg" alt="Adega da Bovio em La Morra">
  <div class="overlay"></div>
  <svg class="noise" width="100%" height="100%">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="number-wrap">
    <div class="number">1976</div>
    <div class="number-label">o primeiro Nebbiolo da casa</div>
  </div>

  <div class="body">Gianfranco Bovio assumiu a adega do pai Alessandro nos anos 1970 e reconstruiu tudo do zero. Um ano depois, lançou o primeiro Barolo de vinhedo único da casa: o <b>Gattera dell'Annunziata</b>.</div>

  <img class="logo" src="../../../dados/gota-transparente.png" alt="comnéctar">
  <div class="progress"><div class="progress-fill"></div></div>
</body>
</html>
