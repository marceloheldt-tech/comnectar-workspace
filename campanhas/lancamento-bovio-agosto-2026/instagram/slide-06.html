<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; position:relative; font-family:'Rubik',sans-serif; }

  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:65% center; }
  .overlay {
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.90) 38%, rgba(0,0,0,0.40) 58%, rgba(0,0,0,0) 76%);
  }
  .overlay-bottom {
    position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 24%);
  }
  .noise { position:absolute; inset:0; opacity:0.05; mix-blend-mode:overlay; }

  .logo { position:absolute; bottom:64px; right:56px; width:120px; filter:drop-shadow(0 4px 20px rgba(0,0,0,0.5)); z-index:2; }

  .panel {
    position:absolute; top:0; left:0; width:600px; height:100%;
    padding:56px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .tag {
    color:#e8578f; font-size:30px; font-weight:700; letter-spacing:2.5px;
    text-transform:uppercase; margin-bottom:36px;
  }
  .headline {
    font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;
    color:#FFFFFF; font-size:65px; font-weight:400; line-height:1.16;
    margin-bottom:28px;
  }
  .body {
    color:rgba(255,255,255,0.85); font-size:34px; font-weight:400; line-height:1.48;
  }
  .body b { color:#e8578f; font-weight:600; }

  .progress { position:absolute; bottom:0; left:0; height:3px; width:100%; background:rgba(255,255,255,0.18); }
  .progress-fill { height:100%; width:75%; background:#991356; }
</style>
</head>
<body>
  <img class="bg" src="../imagens/slide-6-gattera.png" alt="Garrafa do Barolo Gattera, Bovio">
  <div class="overlay"></div>
  <div class="overlay-bottom"></div>
  <svg class="noise" width="100%" height="100%">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="panel">
    <div class="tag">O vinhedo mais antigo</div>
    <div class="headline">Gattera</div>
    <div class="body">As videiras têm décadas de idade, no mesmo vinhedo que deu nome ao primeiro Barolo da família, em 1977. A safra 2020 rendeu só <b>3 mil garrafas</b>, e <b>94 pontos</b> de James Suckling, Wine Advocate e Falstaff.</div>
  </div>

  <img class="logo" src="../../../dados/gota-transparente.png" alt="comnéctar">
  <div class="progress"><div class="progress-fill"></div></div>
</body>
</html>
