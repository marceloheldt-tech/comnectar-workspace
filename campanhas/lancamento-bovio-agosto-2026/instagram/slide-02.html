<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; position:relative; font-family:'Rubik',sans-serif; }

  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 45%; }
  .overlay {
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.62) 45%, rgba(0,0,0,0.90) 100%);
  }
  .noise { position:absolute; inset:0; opacity:0.05; mix-blend-mode:overlay; }

  .logo { position:absolute; bottom:64px; right:56px; width:120px; filter:drop-shadow(0 4px 20px rgba(0,0,0,0.5)); }

  .content { position:absolute; left:56px; right:100px; top:50%; transform:translateY(-50%); }
  .tag {
    color:#e8578f; font-size:33px; font-weight:700; letter-spacing:3px;
    text-transform:uppercase; margin-bottom:32px;
  }
  .headline {
    font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;
    color:#FFFFFF; font-size:70px; font-weight:400; line-height:1.15;
    margin-bottom:28px;
  }
  .body {
    color:rgba(255,255,255,0.88); font-size:40px; font-weight:400; line-height:1.48;
    max-width:920px;
  }

  .progress { position:absolute; bottom:0; left:0; height:3px; width:100%; background:rgba(255,255,255,0.18); }
  .progress-fill { height:100%; width:25%; background:#991356; }
</style>
</head>
<body>
  <img class="bg" src="../imagens/slide-2-uva.png" alt="Uva Nebbiolo na videira">
  <div class="overlay"></div>
  <svg class="noise" width="100%" height="100%">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="content">
    <div class="tag">A uva, o mesmo lugar</div>
    <div class="headline">La Morra faz um Barolo diferente</div>
    <div class="body">É a sub-região mais elegante da denominação, com um Nebbiolo menos áspero e mais aromático do que o resto de Barolo. A família Bovio faz esse estilo há quatro gerações, sem sair do mesmo pedaço de terra.</div>
  </div>

  <img class="logo" src="../../../dados/gota-transparente.png" alt="comnéctar">
  <div class="progress"><div class="progress-fill"></div></div>
</body>
</html>
