<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; position:relative; font-family:'Rubik',sans-serif; }

  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 40%; }
  .overlay {
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.35) 40%, rgba(0,0,0,0.95) 100%);
  }
  .noise { position:absolute; inset:0; opacity:0.05; mix-blend-mode:overlay; }

  .logo { position:absolute; bottom:64px; right:56px; width:170px; filter:drop-shadow(0 4px 20px rgba(0,0,0,0.5)); }

  .stats {
    position:absolute; left:56px; right:56px; bottom:340px;
    display:flex; justify-content:space-between; gap:24px;
  }
  .stat { flex:1; }
  .stat-num {
    font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;
    color:#FFFFFF; font-size:95px; font-weight:400; line-height:1;
    text-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .stat-num em { font-style:normal; color:#991356; }
  .stat-label {
    color:rgba(255,255,255,0.75); font-size:21px; font-weight:600;
    letter-spacing:1px; margin-top:10px; line-height:1.3;
  }

  .divider { position:absolute; left:56px; right:56px; bottom:270px; height:1px; background:rgba(255,255,255,0.2); }

  .body {
    position:absolute; left:56px; right:100px; bottom:96px;
    color:rgba(255,255,255,0.88); font-size:34px; font-weight:400; line-height:1.44;
  }

  .progress { position:absolute; bottom:0; left:0; height:3px; width:100%; background:rgba(255,255,255,0.18); }
  .progress-fill { height:100%; width:62.5%; background:#991356; }
</style>
</head>
<body>
  <img class="bg" src="../imagens/slide-5-aereo.webp" alt="Vista aérea dos vinhedos de La Morra">
  <div class="overlay"></div>
  <svg class="noise" width="100%" height="100%">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="stats">
    <div class="stat">
      <div class="stat-num"><em>8</em></div>
      <div class="stat-label">HECTARES<br>DE VINHEDO</div>
    </div>
    <div class="stat">
      <div class="stat-num">65<span style="font-size:48px">mil</span></div>
      <div class="stat-label">GARRAFAS<br>POR ANO</div>
    </div>
    <div class="stat">
      <div class="stat-num">100<span style="font-size:48px">%</span></div>
      <div class="stat-label">PRODUÇÃO<br>ORGÂNICA</div>
    </div>
  </div>
  <div class="divider"></div>

  <div class="body">É uma produção pequena de propósito, direto dos vinhedos da família em La Morra e Castiglione Falletto. Nada de escala, só atenção a cada parreiral.</div>

  <img class="logo" src="../../../dados/gota-transparente.png" alt="comnéctar">
  <div class="progress"><div class="progress-fill"></div></div>
</body>
</html>
