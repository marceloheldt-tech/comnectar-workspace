<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden; position: relative;
    background: #050505; font-family: 'Rubik', sans-serif;
  }
  .glow {
    position: absolute; top: -220px; left: 50%; transform: translateX(-50%);
    width: 1100px; height: 1100px; border-radius: 50%;
    background: radial-gradient(circle, rgba(153,19,86,0.38) 0%, rgba(153,19,86,0.12) 45%, rgba(153,19,86,0) 72%);
  }
  svg { position: absolute; width: 0; height: 0; }
  .noise { position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: overlay; }
  .content {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 0 100px;
  }
  .logo { width: 220px; margin-bottom: 56px; filter: drop-shadow(0 4px 18px rgba(153,19,86,0.5)); }
  .kicker {
    font-size: 22px; font-weight: 500; letter-spacing: 5px; text-transform: uppercase;
    color: rgba(255,255,255,0.65); display: flex; align-items: center; gap: 10px;
    margin-bottom: 26px;
  }
  .kicker::before, .kicker::after {
    content: ''; width: 7px; height: 7px; border-radius: 50%; background: #991356;
  }
  .title {
    font-family: 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
    font-size: 115px; font-weight: 400; color: #fff; letter-spacing: 1px;
    line-height: 1.08; margin-bottom: 30px;
  }
  .title em { font-style: normal; color: #991356; }
  .body {
    font-size: 38px; font-weight: 400; color: rgba(255,255,255,0.82);
    line-height: 1.5; max-width: 860px; margin-bottom: 44px;
  }
  .options {
    display: flex; gap: 20px; margin-bottom: 44px;
  }
  .option {
    border: 1px solid rgba(255,255,255,0.25); border-radius: 14px;
    padding: 20px 32px; text-align: left;
  }
  .option-label {
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    color: #e8578f; font-weight: 700; margin-bottom: 6px;
  }
  .option-value { font-size: 22px; color: #fff; font-weight: 500; }
  .cta-pill {
    background: #991356; color: #fff; font-weight: 700; font-size: 30px;
    padding: 22px 48px; border-radius: 44px; letter-spacing: 0.5px;
    box-shadow: 0 16px 40px rgba(153,19,86,0.35); margin-bottom: 28px;
  }
  .note { font-size: 25px; color: rgba(255,255,255,0.5); }
  .progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.15); }
  .progress .fill { width: 100%; height: 100%; background: #fff; }
</style>
</head>
<body>
  <svg>
    <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter>
  </svg>
  <div class="glow"></div>
  <div class="noise" style="filter:url(#noiseFilter)"></div>
  <div class="content">
    <img class="logo" src="../../../dados/gota-transparente.png">
    <div class="kicker">Linha Bovio · estoque bem curto</div>
    <div class="title">Kit completo <em>ou avulso.</em></div>
    <div class="body">Uma garrafa de cada rótulo, ou escolha o seu favorito. O Gattera é o mais raro dos cinco.</div>
    <div class="cta-pill">Link na bio</div>
    <div class="note">Chama no direct que a gente te ajuda a escolher</div>
  </div>
  <div class="progress"><div class="fill"></div></div>
</body>
</html>
