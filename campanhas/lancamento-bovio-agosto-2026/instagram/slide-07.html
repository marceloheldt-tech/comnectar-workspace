<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; position:relative; font-family:'Rubik',sans-serif; }

  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%; }
  .overlay {
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.94) 0%, rgba(0,0,0,0.55) 30%, rgba(0,0,0,0.10) 55%, rgba(0,0,0,0.35) 100%);
  }
  .noise { position:absolute; inset:0; opacity:0.05; mix-blend-mode:overlay; }

  .logo { position:absolute; bottom:56px; right:56px; width:170px; filter:drop-shadow(0 4px 20px rgba(0,0,0,0.5)); }

  .tag {
    position:absolute; top:64px; left:56px;
    color:#991356; font-size:18px; font-weight:600; letter-spacing:3.5px;
    text-transform:uppercase;
  }

  .content { position:absolute; left:56px; right:80px; top:130px; }
  .headline {
    font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;
    color:#FFFFFF; font-size:75px; font-weight:400; line-height:1.15;
    text-shadow: 0 4px 30px rgba(0,0,0,0.4); margin-bottom:22px;
  }
  .body {
    color:rgba(255,255,255,0.88); font-size:38px; font-weight:400; line-height:1.46;
    max-width:920px;
  }

  .progress { position:absolute; bottom:0; left:0; height:3px; width:100%; background:rgba(255,255,255,0.18); }
  .progress-fill { height:100%; width:87.5%; background:#991356; }
</style>
</head>
<body>
  <img class="bg" src="../imagens/slide-7-garrafas.png" alt="Os 5 rótulos da linha Bovio">
  <div class="overlay"></div>
  <svg class="noise" width="100%" height="100%">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="tag">A linha completa</div>

  <div class="content">
    <div class="headline">5 rótulos chegaram.</div>
    <div class="body">Do Firagnetti, mais jovem e acessível, até o raro Gattera. No meio do caminho, um Barolo clássico, um Barolo de vinhedo único e um Barbaresco.</div>
  </div>

  <img class="logo" src="../../../dados/gota-transparente.png" alt="comnéctar">
  <div class="progress"><div class="progress-fill"></div></div>
</body>
</html>
